{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('auth.login') }}" class="stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Username
    <input name="username" value="{{ username or '' }}" autocomplete="username" maxlength="30" required autofocus>
  </label>
  <label>Password
    <input name="password" type="password" autocomplete="current-password" maxlength="128" required>
  </label>
  <button type="submit">Sign in</button>
</form>
<p class="aside">No account? <a href="{{ url_for('auth.register') }}">Create one</a>.</p>
{% endblock %}
