{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<h1>Create account</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('auth.register') }}" class="stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Username
    <input name="username" value="{{ username or '' }}" autocomplete="username" maxlength="30" required autofocus>
    <span class="hint">3 to 30 characters: letters, digits, underscore.</span>
  </label>
  <label>Password
    <input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
    <span class="hint">At least 10 characters.</span>
  </label>
  <button type="submit">Create account</button>
</form>
<p class="aside">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a>.</p>
{% endblock %}
